[project]
name = "modrec"
version = "0.1.0"
description = "Recommend Skyrim SE mods from Nexus Mods collection co-occurrence"
readme = "README.md"
license = "GPL-2.0-only"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13",
    "numpy>=1.26",
    "scipy>=1.13",
]

[project.scripts]
modrec = "modrec.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/modrec"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "C4"]
ignore = ["E501", "E731"]
